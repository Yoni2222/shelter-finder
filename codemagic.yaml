workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Tells Codemagic which App Store Connect API key to sign with. Without
    # this, profile lookup fails with "No matching profiles found".
    integrations:
      app_store_connect: Shelter Finder ASC

    environment:
      vars:
        XCODE_WORKSPACE: "client/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.shelterfinder.il"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Node dependencies
        script: |
          cd client
          npm install

      - name: Build web assets
        script: |
          cd client
          CAPACITOR=true npx vite build

      - name: Sync Capacitor
        script: |
          cd client
          npx cap sync ios

      - name: Install xcodeproj gem
        script: |
          gem install xcodeproj

      - name: Add Notification Service Extension target
        script: |
          ruby scripts/setup-ios-extension.rb

      - name: Wire Firebase into the Xcode project
        script: |
          ruby scripts/setup-ios-firebase.rb

      - name: Resolve Swift package dependencies
        script: |
          cd client/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Install CocoaPods (if needed)
        script: |
          cd client/ios/App
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Set up code signing
        script: |
          keychain initialize

          # --create makes Apple generate the distribution certificate and
          # profile if they do not exist yet. The extension ships inside the
          # app, so it needs its own App Store profile too.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$BUNDLE_ID.ShelterAlertExtension" --type IOS_APP_STORE --create

          keychain add-certificates

          # Point at the project explicitly - run from the repo root the
          # default search can miss it, leaving Xcode on automatic signing.
          xcode-project use-profiles \
            --project "client/ios/App/App.xcodeproj" \
            --code-signing-setup-verbose-logging

          # Diagnostic: show which entitlements each downloaded profile
          # actually carries, so a capability mismatch is visible directly.
          for prof in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            [ -e "$prof" ] || continue
            echo "===== $prof"
            security cms -D -i "$prof" > /tmp/prof.plist 2>/dev/null || continue
            /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/prof.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :Entitlements' /tmp/prof.plist 2>/dev/null || true
          done

      - name: Build iOS app
        script: |
          cd client/ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --config "Release"

    artifacts:
      - client/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log


  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      android_signing:
        - shelter_finder_keystore
      vars:
        PACKAGE_NAME: "com.shelterfinder.il"
      node: 22
      java: 17

    scripts:
      - name: Install Node dependencies
        script: |
          cd client
          npm install

      - name: Build web assets
        script: |
          cd client
          CAPACITOR=true npx vite build

      - name: Sync Capacitor
        script: |
          cd client
          npx cap sync android

      - name: Build Android APK
        script: |
          cd client/android
          ./gradlew assembleRelease

    artifacts:
      - client/android/app/build/outputs/**/*.apk
      - client/android/app/build/outputs/**/mapping.txt
