workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Tells Codemagic which App Store Connect API key to sign with. Without
    # this, profile lookup fails with "No matching profiles found".
    integrations:
      app_store_connect: Shelter Finder ASC

    environment:
      # CERTIFICATE_PRIVATE_KEY lives in this Codemagic variable group.
      groups:
        - signin
      vars:
        XCODE_WORKSPACE: "client/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.shelterfinder.il"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Restore Firebase config
        script: |
          # GoogleService-Info.plist is gitignored, so the build machine never
          # receives it from the repo. Without it in the bundle,
          # FirebaseApp.configure() aborts the process at launch.
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "GOOGLE_SERVICE_INFO_PLIST is not set - aborting rather than shipping a build that crashes on launch."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > client/ios/App/App/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' client/ios/App/App/GoogleService-Info.plist

      - name: Install Node dependencies
        script: |
          cd client
          npm install

      - name: Build web assets
        script: |
          cd client
          CAPACITOR=true npx vite build

      - name: Sync Capacitor
        script: |
          cd client
          npx cap sync ios

      - name: Install xcodeproj gem
        script: |
          gem install xcodeproj

      - name: Add Notification Service Extension target
        script: |
          ruby scripts/setup-ios-extension.rb

      - name: Wire Firebase into the Xcode project
        script: |
          ruby scripts/setup-ios-firebase.rb

      - name: Resolve Swift package dependencies
        script: |
          cd client/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Install CocoaPods (if needed)
        script: |
          cd client/ios/App
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Set up code signing
        script: |
          keychain initialize

          # --create makes Apple generate the distribution certificate and
          # profile if they do not exist yet. The extension ships inside the
          # app, so it needs its own App Store profile too.
          # --certificate-key supplies a private key we control. Without it,
          # a certificate that already exists in the Apple account cannot be
          # used - its private key lived on a previous CI machine and is gone,
          # so nothing gets downloaded and every target ends up unsigned.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          app-store-connect fetch-signing-files "$BUNDLE_ID.ShelterAlertExtension" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

          keychain add-certificates

          # Point at the project explicitly - run from the repo root the
          # default search can miss it, leaving Xcode on automatic signing.
          xcode-project use-profiles \
            --project "client/ios/App/App.xcodeproj" \
            --code-signing-setup-verbose-logging

      - name: Set build number
        script: |
          cd client/ios/App
          # TestFlight refuses a build number it has already accepted.
          # Codemagic's BUILD_NUMBER increments per build, so it stays unique.
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build iOS app
        script: |
          cd client/ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --config "Release"

    artifacts:
      - client/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Reuses the 'Shelter Finder ASC' integration declared above.
        auth: integration
        submit_to_testflight: true


  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      android_signing:
        - shelter_finder_keystore
      vars:
        PACKAGE_NAME: "com.shelterfinder.il"
      node: 22
      java: 17

    scripts:
      - name: Restore Firebase config
        script: |
          # GoogleService-Info.plist is gitignored, so the build machine never
          # receives it from the repo. Without it in the bundle,
          # FirebaseApp.configure() aborts the process at launch.
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "GOOGLE_SERVICE_INFO_PLIST is not set - aborting rather than shipping a build that crashes on launch."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > client/ios/App/App/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' client/ios/App/App/GoogleService-Info.plist

      - name: Install Node dependencies
        script: |
          cd client
          npm install

      - name: Build web assets
        script: |
          cd client
          CAPACITOR=true npx vite build

      - name: Sync Capacitor
        script: |
          cd client
          npx cap sync android

      - name: Build Android APK
        script: |
          cd client/android
          ./gradlew assembleRelease

    artifacts:
      - client/android/app/build/outputs/**/*.apk
      - client/android/app/build/outputs/**/mapping.txt
